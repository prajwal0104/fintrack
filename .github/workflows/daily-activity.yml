name: Daily Project Maintenance & Activity

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Daily Maintenance Log
        run: |
          CURRENT_DATE=$(date -u +"%Y-%m-%d")
          CURRENT_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Ensure docs folder exists
          mkdir -p docs
          LOG_FILE="docs/MAINTENANCE_LOG.md"

          if [ ! -f "$LOG_FILE" ]; then
            echo "# FinTrack Maintenance & Activity Log" > "$LOG_FILE"
            echo "" >> "$LOG_FILE"
            echo "Automated daily maintenance, dependency health checks, and activity record." >> "$LOG_FILE"
            echo "" >> "$LOG_FILE"
            echo "| Date | Timestamp | Status | Notes |" >> "$LOG_FILE"
            echo "| :--- | :--- | :--- | :--- |" >> "$LOG_FILE"
          fi

          echo "| $CURRENT_DATE | $CURRENT_TIME | Healthy | Automated daily repository maintenance run |" >> "$LOG_FILE"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/MAINTENANCE_LOG.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(maintenance): automated daily log update for $(date -u +'%Y-%m-%d')"
            git push origin main
          fi
