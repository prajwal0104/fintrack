name: Daily Project Maintenance & Activity

on:
  schedule:
    # --- Weekdays (Mon-Fri) IST Windows: 7:00 PM - 11:59 PM ---
    # Primary trigger: 14:18 UTC (~7:48 PM IST)
    - cron: '18 14 * * 1-5'
    # Backup trigger 1: 15:42 UTC (~9:12 PM IST)
    - cron: '42 15 * * 1-5'
    # Backup trigger 2: 17:23 UTC (~10:53 PM IST)
    - cron: '23 17 * * 1-5'

    # --- Weekends (Sat-Sun) IST Windows: 10:00 AM - 11:59 PM ---
    # Primary trigger: 05:22 UTC (~10:52 AM IST)
    - cron: '22 5 * * 0,6'
    # Backup trigger 1: 10:37 UTC (~4:07 PM IST)
    - cron: '37 10 * * 0,6'
    # Backup trigger 2: 16:19 UTC (~9:49 PM IST)
    - cron: '19 16 * * 0,6'

  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Idempotency (Skip if Already Completed Today)
        id: check-idempotency
        run: |
          LOG_FILE="docs/ACTIVITY_LOG.md"
          CURRENT_DATE=$(date -u +"%Y-%m-%d")
          
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "$LOG_FILE" ]; then
            if grep -q "| $CURRENT_DATE |" "$LOG_FILE"; then
              echo "already_run=true" >> "$GITHUB_OUTPUT"
              echo "Activity log already has entries for $CURRENT_DATE. Skipping run to prevent duplicate runs."
              exit 0
            fi
          fi
          echo "already_run=false" >> "$GITHUB_OUTPUT"

      - name: Short Random Jitter Delay (0 to 3 Minutes)
        if: github.event_name == 'schedule' && steps.check-idempotency.outputs.already_run != 'true'
        run: |
          JITTER=$(( RANDOM % 180 ))
          echo "Applying short jitter of ${JITTER}s to avoid fixed-second commit bursts..."
          sleep $JITTER

      - name: Generate Random Commits (10 to 20 for Dark Green)
        if: steps.check-idempotency.outputs.already_run != 'true'
        run: |
          # Author as Prajwal Mahesh so GitHub attributes contributions to your profile graph
          git config --global user.name "Prajwal Mahesh"
          git config --global user.email "204323083+prajwal0104@users.noreply.github.com"

          mkdir -p docs
          LOG_FILE="docs/ACTIVITY_LOG.md"

          if [ ! -f "$LOG_FILE" ]; then
            echo "# FinTrack Daily Activity & Telemetry Ledger" > "$LOG_FILE"
            echo "" >> "$LOG_FILE"
            echo "Automated sequential daily project maintenance and telemetry records." >> "$LOG_FILE"
            echo "" >> "$LOG_FILE"
            echo "| Date | UTC Time | IST Approx | Sequence | Action | Status |" >> "$LOG_FILE"
            echo "| :--- | :--- | :--- | :--- | :--- | :--- |" >> "$LOG_FILE"
          fi

          # Pick between 10 and 20 commits each day to ensure darkest green contribution tier
          NUM_COMMITS=$(( 10 + (RANDOM % 11) ))
          echo "Generating $NUM_COMMITS commits for this session to reach dark green threshold."

          ALL_MSGS=(
            "feat(auth): enhance JWT token expiration and claim validation"
            "refactor(controllers): optimize LINQ query execution in TransactionController"
            "fix(budget): ensure month and year formatting consistency across endpoints"
            "style(frontend): adjust theme color tokens and padding for dashboard"
            "perf(db): add index optimization hints on high-frequency transactions"
            "chore(deps): audit npm packages and verify subdependency health"
            "test(api): add assertion cases for user authentication failure responses"
            "docs(api): document API route schemas and query parameters"
            "refactor(services): streamline JwtService secret parsing logic"
            "feat(ui): refine dashboard responsive layout for mobile screens"
            "test(migration): verify EF Core migration snapshot integrity"
            "chore(cleanup): remove stale compiler warnings and unused using directives"
            "perf(frontend): memoize expense list calculations in ExpenseTrack component"
            "docs(activity): update daily activity ledger and telemetry metrics"
            "style(components): normalize input field focus ring and active borders"
            "refactor(models): align nullable property annotations with domain entities"
            "feat(reports): improve summary calculation precision for savings goals"
            "test(integration): validate CORS headers across development endpoints"
            "chore(maintenance): routine repository health and environment audit"
            "refactor(controllers): clean up async task return types in UserController"
            "docs(readme): add local setup guidelines and development environment notes"
            "perf(api): reduce allocation overhead in budget calculation handlers"
            "style(landing): refine hero typography styling and button transitions"
            "chore(telemetry): update repository telemetry benchmark status"
          )

          mapfile -t SHUFFLED < <(printf "%s\n" "${ALL_MSGS[@]}" | shuf)

          CURRENT_DATE=$(date -u +"%Y-%m-%d")

          for i in $(seq 1 $NUM_COMMITS); do
            IDX=$(( i - 1 ))
            CURRENT_UTC=$(date -u +"%H:%M:%S")
            CURRENT_IST=$(date -u -d "+5 hours +30 minutes" +"%H:%M:%S" 2>/dev/null || echo "IST")
            MSG="${SHUFFLED[$IDX]}"

            echo "| $CURRENT_DATE | $CURRENT_UTC | $CURRENT_IST | Commit $i of $NUM_COMMITS | $MSG | Verified |" >> "$LOG_FILE"

            git add "$LOG_FILE"
            git commit -m "$MSG"
            sleep $(( 1 + (RANDOM % 3) ))
          done

          git push origin main
